<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Black-Jack Game</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1 id="heading">Black-Jack Game</h1>

    <h2 id="winner"></h2>

    <div class="group">

        <div class="box">
            <h3>Player 1</h3>

            <div id="player1-cards"></div>

            <p id="player1-sum">Sum: 0</p>
        </div>

        <div class="box">
            <h3>Player 2</h3>

            <div id="player2-cards"></div>

            <p id="player2-sum">Sum: 0</p>
        </div>

    </div>

    <div class="buttons">
        <button id="hit">Hit</button>
        <button id="next-game">Next Game</button>
        <button id="stand">Stand</button>
    </div>

    <script src="index.js"></script>

</body>

</html>
